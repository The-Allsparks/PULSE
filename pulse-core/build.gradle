plugins {
    id 'java-library'
    id 'maven-publish'
}

dependencies {
    api "org.allsparks:allsparks-contracts:${rootProject.ext.contractsVersion}"
    testImplementation project(':pulse-testkit')
    testImplementation platform("org.junit:junit-bom:${rootProject.ext.junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat 'full'
    }
}

tasks.withType(JavaCompile).configureEach { compile ->
    compile.options.compilerArgs += ['-Werror']
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'PULSE Core',
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'org.allsparks.pulse'
        )
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = 'pulse-core'
            pom {
                name = 'PULSE Core'
                description = 'Platform-neutral prioritized unified loop sampling engine. No FTC SDK or Android dependency.'
                url = 'https://github.com/The-Allsparks/PULSE'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
            }
        }
    }
}
