version: 2
updates:
  # Workflows pin actions to SHAs with a "# vX.Y.Z" comment. Dependabot still
  # opens PRs that move those pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # JUnit 6 needs Java 17; Hub libraries still compile tests for Java 8 bytecode.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
